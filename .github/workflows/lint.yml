name: lint

# Checks the workflows with actionlint (which runs shellcheck on their scripts). A pinned
# release, checksum-verified, instead of an action that installs the newest one.

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AL_RELEASE: 1.7.12
      # sha256 of actionlint_<release>_linux_amd64.tar.gz (GitHub's asset digest)
      AL_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${AL_RELEASE}/actionlint_${AL_RELEASE}_linux_amd64.tar.gz"
          echo "${AL_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
